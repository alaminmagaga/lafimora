<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" role="img" aria-labelledby="t d">
  <title id="t">Lafimora illustration</title>
  <desc id="d">A mother in a veil cradles her baby beside a phone showing a Lafimora health chat and a facility location pin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9E1"/>
      <stop offset="1" stop-color="#FFD6C8"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D7A68"/>
      <stop offset="1" stop-color="#0F5E50"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9B7E"/>
      <stop offset="1" stop-color="#F27A57"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="#FFE1D6" opacity=".7"/>
      <path d="M14 14l4 4M18 14l-4 4" stroke="#FFE1D6" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#003A43" flood-opacity=".16"/>
    </filter>
    <clipPath id="screen"><rect x="12" y="14" width="176" height="356" rx="22"/></clipPath>
  </defs>

  <!-- backdrop -->
  <circle cx="280" cy="318" r="262" fill="url(#bg)"/>
  <circle cx="280" cy="318" r="214" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 10" opacity=".9"/>
  <circle cx="98" cy="120" r="10" fill="#FF8D6D"/>
  <circle cx="486" cy="470" r="7" fill="#003A43" opacity=".5"/>

  <!-- phone -->
  <g transform="translate(318 74) rotate(7 100 190)" filter="url(#shadow)">
    <rect width="200" height="384" rx="32" fill="#003A43"/>
    <rect x="12" y="14" width="176" height="356" rx="22" fill="#FFFFFF"/>
    <g clip-path="url(#screen)">
      <rect x="12" y="14" width="176" height="50" fill="#F1F3F3"/>
      <circle cx="38" cy="40" r="12" fill="#0B5A46"/>
      <path d="M33 45c2-6 4-9 7-10-1 3 1 5 3 6" stroke="#FFF4E8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <rect x="57" y="33" width="54" height="7" rx="3.5" fill="#22292B"/>
      <rect x="57" y="44" width="34" height="5" rx="2.5" fill="#9CA8AB"/>
      <rect x="152" y="32" width="22" height="16" rx="8" fill="#FF8D6D"/>
      <!-- user message -->
      <rect x="82" y="80" width="94" height="36" rx="16" fill="#003A43"/>
      <rect x="94" y="91" width="70" height="5" rx="2.5" fill="#FFFFFF" opacity=".9"/>
      <rect x="94" y="101" width="46" height="5" rx="2.5" fill="#FFFFFF" opacity=".6"/>
      <!-- answer -->
      <circle cx="32" cy="138" r="9" fill="#0B5A46"/>
      <rect x="46" y="128" width="130" height="78" rx="16" fill="#F1F3F3"/>
      <rect x="58" y="141" width="104" height="5" rx="2.5" fill="#67787C"/>
      <rect x="58" y="153" width="96" height="5" rx="2.5" fill="#67787C"/>
      <rect x="58" y="165" width="106" height="5" rx="2.5" fill="#67787C"/>
      <rect x="58" y="177" width="64" height="5" rx="2.5" fill="#67787C"/>
      <rect x="58" y="190" width="40" height="7" rx="3.5" fill="#FF8D6D" opacity=".55"/>
      <!-- chips -->
      <rect x="46" y="216" width="62" height="20" rx="10" fill="none" stroke="#D0D6D8" stroke-width="1.5"/>
      <rect x="114" y="216" width="58" height="20" rx="10" fill="none" stroke="#D0D6D8" stroke-width="1.5"/>
      <!-- facility card with map -->
      <rect x="24" y="248" width="152" height="70" rx="14" fill="#FFFFFF" stroke="#E3E7E8" stroke-width="1.5"/>
      <rect x="32" y="256" width="46" height="54" rx="10" fill="#E6F2EE"/>
      <path d="M32 284c12-6 22 6 46-4M44 256v54M60 256v54" stroke="#C5DED6" stroke-width="2" fill="none"/>
      <path d="M55 266a8 8 0 0 1 8 8c0 6-8 13-8 13s-8-7-8-13a8 8 0 0 1 8-8z" fill="#FF8D6D"/>
      <circle cx="55" cy="274" r="3" fill="#FFFFFF"/>
      <rect x="86" y="262" width="74" height="6" rx="3" fill="#22292B"/>
      <rect x="86" y="274" width="52" height="5" rx="2.5" fill="#9CA8AB"/>
      <rect x="86" y="289" width="38" height="12" rx="6" fill="#E3F1EA"/>
      <rect x="128" y="289" width="30" height="12" rx="6" fill="#FFE1D6"/>
      <!-- composer -->
      <rect x="22" y="330" width="156" height="30" rx="15" fill="#FFFFFF" stroke="#D0D6D8" stroke-width="1.5"/>
      <circle cx="162" cy="345" r="10" fill="#FF8D6D"/>
      <path d="M162 350v-10M158 344l4-4 4 4" stroke="#161B1D" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- floating location pin -->
  <g transform="translate(462 96)" filter="url(#shadow)">
    <circle r="30" fill="#FFFFFF"/>
    <path d="M0-15a11 11 0 0 1 11 11c0 9-11 19-11 19s-11-10-11-19a11 11 0 0 1 11-11z" fill="#FF8D6D"/>
    <circle cy="-4" r="4" fill="#FFFFFF"/>
  </g>
  <!-- floating heart -->
  <g transform="translate(88 300)" filter="url(#shadow)">
    <circle r="26" fill="#FFFFFF"/>
    <path d="M0 10c-9-6-14-11-14-17a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 6-5 11-14 17z" fill="#1D7A68"/>
  </g>

  <!-- mother -->
  <g>
    <!-- dress -->
    <path d="M128 420c-18 60-30 120-34 180h292c-4-60-14-122-34-180z" fill="url(#dress)"/>
    <path d="M128 420c-18 60-30 120-34 180h292c-4-60-14-122-34-180z" fill="url(#dots)"/>
    <!-- veil (hijab) over head and shoulders -->
    <path d="M216 132c-50 0-80 40-82 92-2 40-14 74-40 112 30 34 74 56 124 62 52 6 104-6 140-34-24-30-36-62-40-104-6-74-44-128-102-128z" fill="url(#veil)"/>
    <!-- face opening -->
    <path d="M222 168c-30 0-50 26-50 58 0 34 20 60 48 62 30 2 52-24 52-58 0-36-20-62-50-62z" fill="#16695A"/>
    <!-- face -->
    <ellipse cx="224" cy="230" rx="38" ry="46" fill="#8A5A3B" transform="rotate(-8 224 230)"/>
    <path d="M190 206c10-26 50-34 70-10" stroke="#16695A" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- closed eyes looking down at baby, soft smile -->
    <path d="M205 230q7 6 14 0M234 228q7 6 14 0" stroke="#3B2416" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M222 254q9 7 19 0" stroke="#3B2416" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="203" cy="244" r="6" fill="#B06B4C" opacity=".45"/>
    <circle cx="252" cy="241" r="6" fill="#B06B4C" opacity=".45"/>
    <!-- veil fold accents -->
    <path d="M150 300c26 30 64 46 104 48M300 260c8 40 20 66 38 84" stroke="#0B4F43" stroke-width="3" fill="none" opacity=".45" stroke-linecap="round"/>

    <!-- baby bundle -->
    <g transform="rotate(-14 270 372)">
      <ellipse cx="262" cy="376" rx="96" ry="46" fill="#FFF4E8"/>
      <path d="M180 360c30-14 92-18 150-4" stroke="#F3DCC6" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M190 392c40 12 96 12 140-6" stroke="#F3DCC6" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- baby head -->
      <circle cx="338" cy="352" r="32" fill="#9A6644"/>
      <path d="M318 330c6-10 22-14 32-8-6 0-10 4-10 8" fill="#3B2416"/>
      <path d="M326 356q6 5 12 0" stroke="#3B2416" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="350" cy="366" r="4" fill="#B06B4C" opacity=".5"/>
      <!-- blanket fold under the baby's chin -->
      <path d="M296 384c14 8 40 10 70-2" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- baby's eyebrow + nose for a gentle sleeping face -->
      <path d="M342 350q6 4 12 0" stroke="#3B2416" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- mother's arm cradling the baby -->
    <path d="M118 340c4 46 40 84 104 92 54 6 102-4 138-26l-10-30c-32 18-76 26-118 20-46-6-74-30-84-62z" fill="#1A715F"/>
    <path d="M334 402c10-10 26-14 34-8 6 5 2 12-6 15l-20 8c-8 3-14-6-8-15z" fill="#8A5A3B"/>
    <path d="M346 400c6-3 12-4 16-2" stroke="#6E452C" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
